name: Flutter CI

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type for a manual run
        required: false
        default: debug
        type: choice
        options:
          - debug
          - profile
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests when test files exist
        shell: bash
        run: |
          shopt -s nullglob globstar
          test_files=(test/**/*_test.dart integration_test/**/*_test.dart)
          if ((${#test_files[@]} == 0)); then
            echo "No Dart test files found; skipping flutter test."
          else
            flutter test --coverage
          fi

      - name: Upload coverage report
        if: hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  ios-build:
    name: Validate iOS build
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned iOS app
        run: flutter build ios --debug --no-codesign

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Build optimized release APK for compatibility checks
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: 'true'
        run: flutter build apk --release

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  android-compatibility:
    name: Android API ${{ matrix.api-level }} permissions and release upgrade
    runs-on: ubuntu-latest
    needs: android-build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 26, 28, 29, 30, 31, 32, 33, 34, 35, 36]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Download optimized release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and cold-start without optional permissions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ANDROID_SMOKE_RESET_DATA=1 ANDROID_SMOKE_DEEP_TESTS=1 bash copilot/scripts/android-startup-smoke.sh apk/app-debug.apk release-apk/app-release.apk

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-startup
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  manual-android-apk:
    name: Manual installable Android APK
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build selected APK
        run: flutter build apk --${{ inputs.build_type || 'debug' }}
      - name: Upload selected APK
        uses: actions/upload-artifact@v4
        with:
          name: 3ialna-${{ inputs.build_type || 'debug' }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
