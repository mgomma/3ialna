name: Firebase App Distribution

on:
  push:
    branches: [dev]
    paths:
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/firebase-app-distribution.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes for testers"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-app-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Check Firebase configuration
        id: firebase_configuration
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Firebase distribution is not configured; build distribution will be skipped."
          fi
      - name: Check out source
        if: steps.firebase_configuration.outputs.configured == 'true'
        uses: actions/checkout@v4
      - name: Set up Java
        if: steps.firebase_configuration.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        if: steps.firebase_configuration.outputs.configured == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter packages
        if: steps.firebase_configuration.outputs.configured == 'true'
        run: flutter pub get --enforce-lockfile
      - name: Build Android debug APK
        if: steps.firebase_configuration.outputs.configured == 'true'
        run: flutter build apk --debug
      - name: Install Firebase CLI
        if: steps.firebase_configuration.outputs.configured == 'true'
        run: npm install --global firebase-tools
      - name: Write Firebase service account credential
        if: steps.firebase_configuration.outputs.configured == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Upload APK to Firebase App Distribution
        if: steps.firebase_configuration.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          RELEASE_NOTES: ${{ inputs.release_notes || format('Automated debug build from {0}', github.sha) }}
        run: |
          group_args=""
          if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
            group_args="--groups $FIREBASE_TESTER_GROUPS"
          fi
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            $group_args \
            --non-interactive
      - name: Remove service account credential
        if: always() && steps.firebase_configuration.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
