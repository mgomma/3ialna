name: Public Debug APK and Firebase Distribution
# Stable evaluation signing is required; releases must remain upgrade-compatible.
# The release is intentionally triggered by dev pushes after secret verification.

on:
  push:
    branches: [dev]
    paths:
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/firebase-app-distribution.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes for Firebase testers"
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: public-debug-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter packages
        run: flutter pub get
      - name: Configure stable evaluation signing
        id: evaluation_signing
        env:
          ANDROID_EVALUATION_KEYSTORE_BASE64: ${{ secrets.ANDROID_EVALUATION_KEYSTORE_BASE64 }}
          ANDROID_EVALUATION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_EVALUATION_KEYSTORE_PASSWORD }}
          ANDROID_EVALUATION_KEY_ALIAS: ${{ secrets.ANDROID_EVALUATION_KEY_ALIAS }}
          ANDROID_EVALUATION_KEY_PASSWORD: ${{ secrets.ANDROID_EVALUATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in ANDROID_EVALUATION_KEYSTORE_BASE64 ANDROID_EVALUATION_KEYSTORE_PASSWORD ANDROID_EVALUATION_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "Missing required Actions secret: ${value}. Refusing to create an upgrade-incompatible APK."
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/3ialna-evaluation.keystore"
          printf '%s' "$ANDROID_EVALUATION_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          configured_alias="${ANDROID_EVALUATION_KEY_ALIAS:-}"
          if [ -n "$configured_alias" ] && keytool -list -keystore "$keystore_path" -storepass "$ANDROID_EVALUATION_KEYSTORE_PASSWORD" -alias "$configured_alias" >/dev/null 2>&1; then
            resolved_alias="$configured_alias"
          else
            resolved_alias="$(keytool -list -keystore "$keystore_path" -storepass "$ANDROID_EVALUATION_KEYSTORE_PASSWORD" 2>/dev/null | awk -F, '$4 ~ /PrivateKeyEntry/ {gsub(/^ +| +$/, "", $1); print $1; exit}')"
            if [ -z "$resolved_alias" ]; then
              echo "No private-key alias was found in the configured evaluation keystore."
              exit 1
            fi
            echo "Configured alias was not found; using the keystore’s private-key alias."
          fi
          cat > android/key.properties <<EOF
          storeFile=$keystore_path
          storePassword=$ANDROID_EVALUATION_KEYSTORE_PASSWORD
          keyAlias=$resolved_alias
          keyPassword=$ANDROID_EVALUATION_KEY_PASSWORD
          EOF
          chmod 600 android/key.properties "$keystore_path"
          echo "description=GitHub optimized stable-signed evaluation release" >> "$GITHUB_OUTPUT"
      - name: Build optimized public evaluation APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Publish optimized public evaluation pre-release
        id: public_release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_DESCRIPTION: ${{ steps.evaluation_signing.outputs.description }}
        run: |
          set -euo pipefail
          app_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version_name="${app_version%%+*}"
          build_number="${app_version#*+}"
          if [ "$build_number" = "$app_version" ]; then build_number="0"; fi
          release_tag="optimized-v${version_name}-b${build_number}-run${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          # Keep these names identical to Flutter's split-APK output filenames.
          # GitHub CLI uploads the file basename, so using custom display aliases
          # here produced metadata URLs that did not exist and returned 404.
          arm64_asset="app-arm64-v8a-release.apk"
          armv7_asset="app-armeabi-v7a-release.apk"
          arm64_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${arm64_asset}"
          armv7_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${armv7_asset}"

          cat > "$RUNNER_TEMP/public-debug-notes.md" <<EOF
          ## Optimized public Android evaluation build

          These APKs are **release-mode optimized, architecture-specific evaluation builds** for Android. R8 and Android resource shrinking are enabled. The arm64 file is for most current Android phones; they are not Play Store releases and should not be used as a production distribution channel.

          Signing: ${SIGNING_DESCRIPTION}

          - Version: ${version_name} (${build_number})
          - Source commit: ${GITHUB_SHA}
          - Installation: Android may require the user to allow installation from their browser or file manager.
          EOF

          gh release create "$release_tag" \
            "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk#${arm64_asset}" \
            "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk#${armv7_asset}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "3ialna optimized evaluation ${version_name} (${build_number})" \
            --notes-file "$RUNNER_TEMP/public-debug-notes.md" \
            --prerelease

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "download_url=$arm64_url" >> "$GITHUB_OUTPUT"
          echo "arm64_url=$arm64_url" >> "$GITHUB_OUTPUT"
          echo "armv7_url=$armv7_url" >> "$GITHUB_OUTPUT"
      - name: Synchronize public website download metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.public_release.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.public_release.outputs.build_number }}
          DOWNLOAD_URL: ${{ steps.public_release.outputs.download_url }}
          ARM64_URL: ${{ steps.public_release.outputs.arm64_url }}
          ARMV7_URL: ${{ steps.public_release.outputs.armv7_url }}
          SIGNING_DESCRIPTION: ${{ steps.evaluation_signing.outputs.description }}
        run: |
          set -euo pipefail
          # Test or documentation commits can land on dev while the APK builds.
          # Begin the metadata commit from the newest remote tip so they remain intact.
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          cat > website/src/release.generated.ts <<EOF
          // Desert Signal style reminder: release facts are practical, calm, and transparent.
          // This file is rewritten automatically by the public debug-release workflow.
          export const currentRelease = {
            platform: "Android",
            version: "$VERSION_NAME",
            build: "$BUILD_NUMBER",
            distribution: "$SIGNING_DESCRIPTION",
            downloadUrl: "$DOWNLOAD_URL",
            downloadUrls: {
              arm64: "$ARM64_URL",
              armv7: "$ARMV7_URL",
            },
            publishedAt: "$published_at",
          } as const;
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/release.generated.ts
          if git diff --cached --quiet; then
            echo "Website download metadata is already current."
            exit 0
          fi
          git commit -m "chore(website): sync public debug APK [skip ci]"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            # Retry once if another non-conflicting source or test commit arrives.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          gh workflow run deploy-website.yml --ref "$GITHUB_REF_NAME"
      - name: Check Firebase configuration
        id: firebase_configuration
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Firebase distribution is not configured; continuing with the public debug release only."
          fi
      - name: Install Firebase CLI
        if: steps.firebase_configuration.outputs.configured == 'true'
        run: npm install --global firebase-tools
      - name: Write Firebase service account credential
        if: steps.firebase_configuration.outputs.configured == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Upload APK to Firebase App Distribution
        if: steps.firebase_configuration.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          RELEASE_NOTES: ${{ inputs.release_notes || format('Automated debug build from {0}', github.sha) }}
        run: |
          group_args=""
          if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
            group_args="--groups $FIREBASE_TESTER_GROUPS"
          fi
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            $group_args \
            --non-interactive
      - name: Remove release credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" "$RUNNER_TEMP/3ialna-evaluation.keystore" android/key.properties
